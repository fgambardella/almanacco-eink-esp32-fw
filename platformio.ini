[env:lolin_d32]
platform = platformio/espressif32@8.0.0
board = lolin_d32
framework = arduino
monitor_speed = 115200
lib_deps =
    zinggjm/GxEPD2@1.6.9
    adafruit/Adafruit GFX Library@1.13.0
; Avvisi severi solo sul codice del progetto (src/), non sulle librerie.
build_src_flags =
    -Wall
    -Wextra
