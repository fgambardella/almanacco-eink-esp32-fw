; Versioni fissate con il numero esatto: la scelta e il motivo sono nel README.

; `pio run` senza -e compila solo il firmware normale.
[platformio]
default_envs = lolin_d32

[env:lolin_d32]
platform = platformio/espressif32@8.0.0
board = lolin_d32
framework = arduino
monitor_speed = 115200
lib_deps =
    zinggjm/GxEPD2@1.6.9
    adafruit/Adafruit GFX Library@1.13.0
; Avvisi severi solo sul codice del progetto (src/), non sulle librerie.
build_src_flags =
    -Wall
    -Wextra

; Modalita' pulizia schermo: stesso firmware, ma riporta il display a bianco
; invece di disegnare "Hello, world!". Si usa con -e lolin_d32_clear.
[env:lolin_d32_clear]
extends = env:lolin_d32
build_flags =
    -DALMANACCO_CLEAR_SCREEN
